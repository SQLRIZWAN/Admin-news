name: TMP - deploy rules to treding-store-2 (DELETE ME)

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Firestore security rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RULES_B64: 
        run: python3 - <<'PYEOF'
import base64, json, os, subprocess, sys, time, urllib.error, urllib.parse, urllib.request

TARGET_PROJECT = "treding-store-2"
rules_text = base64.b64decode(os.environ["RULES_B64"]).decode()

def log(*a):
    print(*a, flush=True)

try:
    sa = json.loads(os.environ["SA_JSON"])
except Exception as e:
    log("FATAL: cannot parse FIREBASE_SERVICE_ACCOUNT:", type(e).__name__)
    sys.exit(0)
log("SA_EMAIL=%s" % sa.get("client_email", "?"))
log("SA_PROJECT=%s" % sa.get("project_id", "?"))

def b64url(b):
    return base64.urlsafe_b64encode(b).rstrip(b"=")

try:
    now = int(time.time())
    header = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
    claims = b64url(json.dumps({
        "iss": sa["client_email"],
        "scope": "https://www.googleapis.com/auth/cloud-platform",
        "aud": "https://oauth2.googleapis.com/token",
        "exp": now + 3600, "iat": now,
    }).encode())
    signing_input = header + b"." + claims
    open("/tmp/sa_key.pem", "w").write(sa["private_key"])
    sig = subprocess.check_output(["openssl", "dgst", "-sha256", "-sign", "/tmp/sa_key.pem"], input=signing_input)
    jwt = (signing_input + b"." + b64url(sig)).decode()
    req = urllib.request.Request(
        "https://oauth2.googleapis.com/token",
        data=urllib.parse.urlencode({
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": jwt,
        }).encode())
    token = json.loads(urllib.request.urlopen(req).read())["access_token"]
    log("MINTED_TOKEN length=%d (never printed)" % len(token))
except Exception as e:
    log("FATAL token mint failed:", type(e).__name__, str(e)[:200])
    sys.exit(0)

H = {"Authorization": "Bearer " + token, "Content-Type": "application/json; charset=utf-8"}

def call(method, url, payload=None):
    data = json.dumps(payload).encode() if payload is not None else None
    r = urllib.request.Request(url, data=data, headers=H, method=method)
    try:
        resp = urllib.request.urlopen(r)
        return resp.status, resp.read().decode()
    except urllib.error.HTTPError as e:
        return e.code, e.read().decode()

st, body = call("GET", "https://firebaserules.googleapis.com/v1/projects/%s/firestore/releases" % TARGET_PROJECT)
log("PROBE GET releases -> HTTP %s" % st)
log("PROBE body: " + body[:600])
if st >= 400:
    log("RESULT=NO_ACCESS - service account cannot touch %s" % TARGET_PROJECT)
    sys.exit(0)

payload = {"source": {"files": [{"path": "firestore.rules", "content": rules_text}]}}
st, body = call("POST", "https://firebaserules.googleapis.com/v1/projects/%s/rulesets" % TARGET_PROJECT, payload)
log("CREATE ruleset -> HTTP %s" % st)
if st >= 400:
    log("RESULT=CREATE_FAILED body: " + body[:800])
    sys.exit(0)
ruleset_name = json.loads(body).get("name")
log("RULESET=%s" % ruleset_name)

st, body = call(
    "PATCH",
    "https://firebaserules.googleapis.com/v1/projects/%s/firestore/releases/cloud.firestore?updateMask=rulesetName" % TARGET_PROJECT,
    {"rulesetName": ruleset_name})
log("RELEASE -> HTTP %s" % st)
log("RELEASE body: " + body[:600])
log("RESULT=%s" % ("DEPLOYED" if st < 400 else "RELEASE_FAILED"))
PYEOF
